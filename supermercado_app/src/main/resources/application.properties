#DB MySQL
spring.application.name=supermercado_app
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
server.port=8080

#Integracion MercadoPago
mercadopago.notification-url=${URL_NOTIFICATION}

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Configuraci\u00f3n de archivos Excel
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Vigencia del an\u00e1lisis antes de confirmar
app.importacion.excel.expiracion-minutos=30